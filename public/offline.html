<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Nexxus CRM</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        background: #f5f3f0;
        color: #111111;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #f5f3f0; }
        .card { border-color: rgba(245,243,240,0.15); }
        .muted { color: #8a857d; }
        .btn { background: #f5f3f0; color: #111111; }
      }
      .card {
        max-width: 360px;
        border: 1px solid rgba(17,17,17,0.1);
        border-radius: 16px;
        padding: 28px;
        background: rgba(255,255,255,0.5);
        backdrop-filter: blur(8px);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; line-height: 1.5; font-size: 14px; }
      .muted { color: #6b675f; }
      .btn {
        appearance: none;
        border: 0;
        background: #111111;
        color: #f5f3f0;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover { opacity: 0.9; }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #111111;
        color: #f5f3f0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">N</div>
      <h1>You are offline</h1>
      <p class="muted">Reconnect to the internet to continue working in Nexxus CRM. Your last sync is preserved locally.</p>
      <button class="btn" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
